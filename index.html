<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  

  <div class="login-box" id="loginBox">
    <h2 class="title">Enter Username</h2>
    <input id="usernameInput" class="input username-input" placeholder="Username">
    <button class="btn login-btn" onclick="login()">Login</button>
  </div>

  <div class="chat-box hidden" id="chatBox">
    <h2 class="title">Chat</h2>

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <input id="messageInput" class="input message-input" placeholder="Type a message...">
      <button class="btn send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
